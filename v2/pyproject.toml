[project]
name = "rlm-scheme-v2"
version = "0.1.0"
description = "RLM-Scheme v2 — Artifact-based LLM orchestration"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13",
    "fastmcp>=3.4",
    "openai",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rlm_scheme*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
